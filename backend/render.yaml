services:
  - type: web
    name: proposalcraft-backend
    env: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: starter
    region: oregon
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: proposalcraft-db
          property: connectionString
      - key: ENVIRONMENT
        value: production
      - key: CORS_ORIGINS
        value: "*"
      - key: SECRET_KEY
        generateValue: true

databases:
  - name: proposalcraft-db
    databaseName: proposalcraft
    user: proposalcraft_user
    plan: starter
    region: oregon
